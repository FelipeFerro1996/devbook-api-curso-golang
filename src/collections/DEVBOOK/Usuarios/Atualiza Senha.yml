info:
  name: Atualiza Senha
  type: http
  seq: 6

http:
  method: POST
  url: "{{url}}/usuarios/1/atualizar-senha"
  body:
    type: json
    data: |-
      {
        "atual": "123456",
        "nova":"123456"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
